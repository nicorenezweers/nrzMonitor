# Entwicklungs- und Release-Befehle: `cargo xtask` (Hilfe), z. B. `cargo xtask dev`.
[alias]
xtask = "run --quiet --package xtask --"

# Linux: libduckdb.so liegt neben dem Programm (siehe `cargo xtask umbrel-release` und `cargo xtask docker-image`).
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]
