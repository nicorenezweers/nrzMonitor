[workspace]
resolver = "2"
members = ["shared", "server"]
# Die Oberflaeche ist ein eigener Workspace (WASM): `cd web && dx serve`.
exclude = ["web"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "shared", package = "nrzmon-shared" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Ohne Debug-Infos: die Build-Ordner bleiben klein (wichtig bei mehreren Arbeitskopien nebeneinander).
[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 1
