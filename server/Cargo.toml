[package]
name = "nrzmon-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "nrzMonitor – Sammler, DuckDB-Speicher und API"

[[bin]]
name = "nrzmonitor"
path = "src/main.rs"

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"
getrandom = "0.3"
fastrand = "2"
libc = "0.2"
# DuckDB ohne `bundled`: die Bibliothek kommt fertig gebaut von duckdb.org (wird beim Bauen fuer das
# Ziel geladen) und liegt als libduckdb neben dem Programm. Kein `parquet`/`json`-Feature setzen –
# das wuerde DuckDB aus dem Quelltext bauen; beide Erweiterungen stecken schon in der Bibliothek.
duckdb = "1.20000"
# HTTP-Client fuer Integrationen (MCP, Cloudflare, NetBird, Benachrichtigungen).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }


# --- Abschnitt: Speicher & Abfragen ---------------------------------------------------------------


# --- Abschnitt: System ----------------------------------------------------------------------------


# --- Abschnitt: Docker & Alarme -------------------------------------------------------------------


# --- Abschnitt: Netzwerk-Integrationen ------------------------------------------------------------
# Erreichbarkeit: HTTPS mit Zeitanteilen (DNS, Verbinden, TLS …) – beide stecken schon ueber reqwest im Lockfile.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"


# --- Abschnitt: MCP -------------------------------------------------------------------------------
# Interne Aufrufe der eigenen API (Router als Dienst) – steckt ueber axum schon im Lockfile.
tower = { version = "0.5", features = ["util"] }


[lints.clippy]
dbg_macro = "deny"
todo = "deny"
await_holding_lock = "deny"
